<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash of Katipuneros (CoC Style)</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0b0f19;
            font-family: 'Arial Black', Gadget, sans-serif; color: white;
            user-select: none; overflow: hidden; width: 100vw; height: 100vh;
        }
        .screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: absolute; top:0; left:0; }
        
        /* HEADER HUD */
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 15px; background: linear-gradient(to bottom, #1e293b, #0f172a); height: 12vh; box-sizing: border-box;
            border-bottom: 3px solid #475569;
        }
        h1 { margin: 0; font-size: 1rem; color: #f1c40f; text-shadow: 2px 2px #000; }
        .stats-container { display: flex; gap: 10px; }
        .stat { background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; border: 2px solid #555; font-weight: bold; }
        .gold-text { color: #f1c40f; border-color: #f1c40f; }
        .elixir-text { color: #ec4899; border-color: #ec4899; }
        .hp-text { color: #ef4444; border-color: #ef4444; }

        /* CANVAS AREA */
        #gameContainer { position: relative; width: 100vw; height: 58vh; background: #1e3a1e; }
        canvas { width: 100%; height: 100%; display: block; }

        /* BOTTOM CONTROLS */
        #controls {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 10px; background: #0f172a; height: 30vh;
            box-sizing: border-box; border-top: 4px solid #334155;
        }
        .btn {
            color: white; border: 3px solid #f1c40f; border-radius: 10px;
            padding: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer;
            flex: 1; height: 85%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            box-shadow: 0 4px 0px #b45309; text-shadow: 1px 1px 0px #000;
            transition: 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0px #b45309; }
        .collect-btn { background: linear-gradient(to bottom, #eab308, #ca8a04); }
        .elixir-btn { background: linear-gradient(to bottom, #ec4899, #db2777); border-color: #ec4899; box-shadow: 0 4px 0px #9d174d; }
        .attack-btn { background: linear-gradient(to bottom, #ef4444, #dc2626); border-color: #f1c40f; box-shadow: 0 4px 0px #991b1b; }
        .btn span { font-size: 0.55rem; color: #e2e8f0; margin-top: 4px; }

        /* MENU SCREEN overlay */
        #menuScreen { background: radial-gradient(circle, #292524, #1c1917); justify-content: center; align-items: center; z-index: 100; }
        .menu-content {
            background: rgba(0, 0, 0, 0.85); padding: 30px; border-radius: 20px;
            border: 4px solid #f1c40f; text-align: center; width: 85%; max-width: 340px;
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.4);
        }
        .menu-title { font-size: 1.8rem; color: #f1c40f; text-shadow: 3px 3px 0px #000; margin-bottom: 20px; font-style: italic; }
        .play-btn { background: linear-gradient(to bottom, #f97316, #ea580c); box-shadow: 0 4px 0px #9a3412; width: 100%; height: 55px; font-size: 1rem; }

        /* FLOATING COMBAT LOG */
        #combatLog {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);
            border: 2px solid #ef4444; color: #fde047; font-size: 0.65rem; padding: 6px;
            border-radius: 6px; font-family: monospace; z-index: 10; max-width: 200px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="menuScreen" class="screen">
        <div class="menu-content">
            <div class="menu-title">⚔️ CLASH OF<br>KATIPUNEROS</div>
            <button class="btn play-btn" onclick="switchScreen('baseScreen')">ENTER VILLAGE</button>
        </div>
    </div>

    <div id="baseScreen" class="screen" style="display: none;">
        <div class="game-header">
            <h1>🏰 AKING BARYO (TH 1)</h1>
            <div class="stats-container">
                <div class="stat gold-text" id="baseGold">🪙 200</div>
                <div class="stat elixir-text" id="baseElixir">🧪 100</div>
            </div>
        </div>
        <div id="gameContainer">
            <canvas id="baseCanvas"></canvas>
        </div>
        <div id="controls">
            <button class="btn collect-btn" onclick="collectResources()">🪙 MINING<br><span>+50 Ginto / Elixir</span></button>
            <button class="btn elixir-btn" onclick="trainUnit('barbarian')">🪓 TRAIN TROOP<br><span>(20 Elixir)<br><b id="bCount">Mayroon: 0</b></span></button>
            <button class="btn attack-btn" onclick="switchScreen('battleScreen')">⚔️ ATTACK!<br><span>Mag-raid sa Kalaban</span></button>
        </div>
    </div>

    <div id="battleScreen" class="screen" style="display: none;">
        <div class="game-header">
            <h1 style="color:#ef4444;">🔥 RAIDING ENEMY BASE</h1>
            <div class="stats-container">
                <div class="stat hp-text" id="enemyThHp">🏰 ENEMY TH: 1000/1000</div>
            </div>
        </div>
        <div id="combatLog">Tap screen or Deploy button to drop Katipuneros!</div>
        <div id="gameContainer">
            <canvas id="battleCanvas"></canvas>
        </div>
        <div id="controls">
            <button class="btn attack-btn" onclick="spawnTroop()">🪓 DEPLOY TROOP<br><span>Tropa na Naiwan: <b id="remTroops">0</b></span></button>
            <button class="btn collect-btn" style="background: #4b5563; border-color: #9ca3af; box-shadow: 0 4px 0px #374151;" onclick="switchScreen('baseScreen')">🏃 SURRENDER<br><span>Umuwi sa Base</span></button>
        </div>
    </div>

    <script>
        // Game Global Variables
        let gold = 200;
        let elixir = 100;
        let trainedTroops = 0;
        let currentScreen = "menuScreen";
        let animFrame = 0;

        // Battle Variables
        let enemyThMaxHp = 1000;
        let enemyThHp = 1000;
        let activeTroops = [];
        let damageTexts = [];
        let particles = [];

        // Canvas Setup references
        let baseCanvas = document.getElementById("baseCanvas");
        let baseCtx = baseCanvas ? baseCanvas.getContext("2d") : null;
        let battleCanvas = document.getElementById("battleCanvas");
        let battleCtx = battleCanvas ? battleCanvas.getContext("2d") : null;

        // Screen Swapping Engine
        function switchScreen(screenId) {
            document.getElementById("menuScreen").style.display = "none";
            document.getElementById("baseScreen").style.display = "none";
            document.getElementById("battleScreen").style.display = "none";

            document.getElementById(screenId).style.display = "flex";
            currentScreen = screenId;

            // Resize canvas context dynamically on screen switch
            if (screenId === "baseScreen") {
                baseCanvas.width = baseCanvas.clientWidth;
                baseCanvas.height = baseCanvas.clientHeight;
                updateHUD();
            } else if (screenId === "battleScreen") {
                battleCanvas.width = battleCanvas.clientWidth;
                battleCanvas.height = battleCanvas.clientHeight;
                // Reset enemy base layout on fresh attack
                enemyThHp = 1000;
                activeTroops = [];
                damageTexts = [];
                particles = [];
                document.getElementById("remTroops").innerText = trainedTroops;
                document.getElementById("enemyThHp").innerText = `🏰 ENEMY TH: ${enemyThHp}/1000`;
            }
        }

        function updateHUD() {
            document.getElementById("baseGold").innerText = `🪙 GINTO: ${gold}`;
            document.getElementById("baseElixir").innerText = `🧪 ELIXIR: ${elixir}`;
            document.getElementById("bCount").innerText = `Mayroon: ${trainedTroops}`;
        }

        // Base Mechanics
        function collectResources() {
            gold += 50;
            elixir += 50;
            updateHUD();
            // Trigger quick sound indicator or splash
        }

        function trainUnit(type) {
            if (elixir >= 20) {
                elixir -= 20;
                trainedTroops++;
                updateHUD();
            } else {
                alert("Kulang sa Elixir! Mag-mina muna.");
            }
        }

        // Raid Deployment Engine
        function spawnTroop() {
            if (trainedTroops > 0) {
                trainedTroops--;
                document.getElementById("remTroops").innerText = trainedTroops;
                
                // Spawn a troop at the left side edge walking towards right (Enemy TownHall)
                activeTroops.push({
                    x: 30,
                    y: battleCanvas.height / 2 + (Math.random() - 0.5) * 40,
                    hp: 150, maxHp: 150,
                    dmg: 25, speed: 1.5,
                    state: "walk", lastHit: 0
                });
                document.getElementById("combatLog").innerText = "🪓 Tropa pumasok sa digmaan!";
            } else {
                document.getElementById("combatLog").innerText = "❌ Walang natitirang tropa! Mag-train muna sa Base.";
            }
        }

        // Floating FX Spawners
        function createTextFx(x, y, txt, color) {
            damageTexts.push({ x: x, y: y, text: txt, color: color, alpha: 1, vy: -1 });
        }
        function createBlastFx(x, y, color) {
            for(let i=0; i<6; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5)*4, vy: (Math.random() - 0.5)*4,
                    r: Math.random()*3 + 1, alpha: 1, color: color
                });
            }
        }

        // Core Rendering Loops
        function gameTick() {
            animFrame++;

            if (currentScreen === "baseScreen" && baseCtx) {
                // Clear and Draw Own Grass Base
                baseCtx.fillStyle = "#1e3a1e"; baseCtx.fillRect(0, 0, baseCanvas.width, baseCanvas.height);
                
                // Grid lines for CoC Style aesthetic look
                baseCtx.strokeStyle = "#162e16"; baseCtx.lineWidth = 1;
                for(let i=0; i<baseCanvas.width; i+=25) { baseCtx.beginPath(); baseCtx.moveTo(i,0); baseCtx.lineTo(i, baseCanvas.height); baseCtx.stroke(); }

                // Draw central TownHall Building
                let thX = baseCanvas.width / 2 - 35;
                let thY = baseCanvas.height / 2 - 30;
                baseCtx.fillStyle = "#b45309"; baseCtx.fillRect(thX, thY, 70, 50); // Main house
                baseCtx.fillStyle = "#f59e0b"; baseCtx.beginPath(); baseCtx.moveTo(thX-5, thY); baseCtx.lineTo(thX+35, thY-20); baseCtx.lineTo(thX+75, thY); baseCtx.fill(); // Roof
                baseCtx.fillStyle = "#fff"; baseCtx.font = "bold 9px Arial"; baseCtx.fillText("MY TOWN HALL", thX+3, thY+25);

                // Draw Gold Mine Left Side
                baseCtx.fillStyle = "#ca8a04"; baseCtx.fillRect(thX - 70, thY + 10, 30, 30);
                baseCtx.fillStyle = "#fff"; baseCtx.fillText("MINE", thX - 68, thY + 28);

                // Draw Elixir Pump Right Side
                baseCtx.fillStyle = "#db2777"; baseCtx.fillRect(thX + 110, thY + 10, 30, 30);
                baseCtx.fillStyle = "#fff"; baseCtx.fillText("PUMP", thX + 112, thY + 28);

            } else if (currentScreen === "battleScreen" && battleCtx) {
                // Clear and Draw Battleground
                battleCtx.fillStyle = "#2c4a21"; battleCtx.fillRect(0, 0, battleCanvas.width, battleCanvas.height);

                // Draw Target Enemy Town Hall at the far right
                let ethX = battleCanvas.width - 100;
                let ethY = battleCanvas.height / 2 - 35;
                
                if (enemyThHp > 0) {
                    battleCtx.fillStyle = "#78350f"; battleCtx.fillRect(ethX, ethY, 80, 60); // Building Block
                    battleCtx.fillStyle = "#dc2626"; battleCtx.beginPath(); battleCtx.moveTo(ethX-5, ethY); battleCtx.lineTo(ethX+40, ethY-25); battleCtx.lineTo(ethX+85, ethY); battleCtx.fill(); // Enemy Red Roof
                    
                    // Main Health Bar Above Enemy TH (Kitang kita ang bawas!)
                    battleCtx.fillStyle = "rgba(0,0,0,0.5)"; battleCtx.fillRect(ethX, ethY - 35, 80, 6);
                    let hpRatio = enemyThHp / enemyThMaxHp;
                    battleCtx.fillStyle = "#2ecc71"; battleCtx.fillRect(ethX, ethY - 35, 80 * hpRatio, 6);
                    battleCtx.fillStyle = "#fff"; battleCtx.font = "bold 9px monospace";
                    battleCtx.fillText(`TH: ${enemyThHp}/1000`, ethX + 5, ethY - 42);
                } else {
                    // Destroyed Ruins
                    battleCtx.fillStyle = "#451a03"; battleCtx.fillRect(ethX, ethY + 20, 80, 20);
                    battleCtx.fillStyle = "#fff"; battleCtx.font = "bold 12px Arial";
                    battleCtx.fillText("💥 DESTROYED!", ethX - 10, ethY);
                }

                // Troops management & movement AI
                activeTroops.forEach((t, idx) => {
                    let targetX = ethX - 15; // Stop in front of TH wall
                    let distance = targetX - t.x;

                    if (enemyThHp <= 0) {
                        t.state = "walk"; // Victory cheer move
                    } else if (distance <= 15) {
                        t.state = "attack";
                    } else {
                        t.state = "walk";
                    }

                    // Behavior Logic Action
                    if (t.state === "walk") {
                        t.x += t.speed;
                    } else if (t.state === "attack" && enemyThHp > 0) {
                        if (Date.now() - t.lastHit > 1000) {
                            enemyThHp = Math.max(0, enemyThHp - t.dmg);
                            t.lastHit = Date.now();
                            
                            // Trigger dynamic impacts
                            createTextFx(ethX + Math.random()*40, ethY + 20, `-${t.dmg}`, "#f43f5e");
                            createBlastFx(ethX, ethY + 30, "#facc15");
                            
                            document.getElementById("enemyThHp").innerText = `🏰 ENEMY TH: ${enemyThHp}/1000`;
                            document.getElementById("combatLog").innerText = `💥 Tinaga ang Town Hall! -${t.dmg} HP`;

                            // Loot rewards on every continuous hit
                            gold += 10; elixir += 5;

                            if(enemyThHp <= 0) {
                                document.getElementById("combatLog").innerText = "🏆 VICTORY! Nawasak ang base ng kalaban! +100 Gold Bonus!";
                                gold += 100;
                            }
                        }
                    }

                    // Draw 3D-ish Barbarian/Katipunero Character Model
                    battleCtx.save();
                    let bounceY = (t.state === "walk") ? Math.sin(animFrame * 0.4) * 3 : 0;
                    let swingW = (t.state === "attack") ? Math.sin(animFrame * 0.6) * 0.5 : 0;
                    
                    // Shadow
                    battleCtx.fillStyle = "rgba(0,0,0,0.25)";
                    battleCtx.beginPath(); battleCtx.arc(t.x, t.y, 8, 0, Math.PI*2); battleCtx.fill();
                    
                    // Body capsule & Hair
                    battleCtx.translate(t.x, t.y + bounceY);
                    battleCtx.fillStyle = "#ef4444"; battleCtx.fillRect(-5, -22, 10, 16); // Red vest
                    battleCtx.fillStyle = "#fed7aa"; battleCtx.beginPath(); battleCtx.arc(0, -26, 5, 0, Math.PI*2); battleCtx.fill(); // Head
                    battleCtx.fillStyle = "#fbbf24"; battleCtx.fillRect(-5, -33, 10, 4); // Yellow Hair band
                    
                    // Weapon Sword Rotation
                    battleCtx.translate(4, -14);
                    battleCtx.rotate(swingW);
                    battleCtx.strokeStyle = "#e2e8f0"; battleCtx.lineWidth = 2.5;
                    battleCtx.beginPath(); battleCtx.moveTo(0,0); battleCtx.lineTo(10, -10); battleCtx.stroke();
                    battleCtx.restore();
                });

                // Render Floating numbers
                for (let i = damageTexts.length - 1; i >= 0; i--) {
                    let dt = damageTexts[i];
                    dt.y += dt.vy; dt.alpha -= 0.03;
                    if(dt.alpha <= 0) { damageTexts.splice(i, 1); continue; }
                    battleCtx.save(); battleCtx.globalAlpha = dt.alpha;
                    battleCtx.fillStyle = dt.color; battleCtx.font = "bold 13px Arial Black";
                    battleCtx.fillText(dt.text, dt.x, dt.y); battleCtx.restore();
                }

                // Render Blast Sparks particles
                for(let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                    if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                    battleCtx.save(); battleCtx.globalAlpha = p.alpha; battleCtx.fillStyle = p.color;
                    battleCtx.beginPath(); battleCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); battleCtx.fill(); battleCtx.restore();
                }
            }

            requestAnimationFrame(gameTick);
        }

        // Auto Start Trigger on page complete load
        window.onload = () => {
            switchScreen("menuScreen");
            requestAnimationFrame(gameTick);
        };
    </script>
</body>
</html>
